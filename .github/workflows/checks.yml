name: Checks

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths-ignore:
      - '**.md'
      - '**.png'

  pull_request:

# The job only reads the repository.
permissions:
  contents: read

# A new push to the same branch makes the running check pointless.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (Windows, Python 3.14)
    # The app talks to WMI and Windows serial ports, and its tests import pywin32 and drive Tk, so
    # only a Windows runner can run them.
    runs-on: windows-latest
    # The suite takes under a minute; a hung Tk, WMI or serial call must not hold the runner for hours.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          # The uv that uv.lock resolves for pre-commit-uv, so CI and a local run use the same one.
          version: "0.12.23"
          enable-cache: true
          cache-python: true
          python-version: "3.14"

      - name: Install the project
        run: uv sync --locked --dev

      # The same hooks as a local commit: ruff, ty, the test suite and the lock-file check.
      - name: Pre-commit on all files
        run: uv run pre-commit run --all-files
