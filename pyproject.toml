[project]
name = "iets-speed-control"
version = "0"
description = "Fan Speed Control for 12V IETS Laptop Cooler Stands"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "aioserial",
    "pyserial",
    "wmi",
    "pystray",
    "customtkinter",
    "Pillow",
    "ruamel-yaml",
]

[dependency-groups]
dev = [
    "pre-commit-uv",
    "pyinstaller",
    "pytest",
    "pytest-asyncio",
    "pytest-xdist>=3.8.0",
    "ruff",
    "rust-just",
    "ty>=0.0.84",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 120

[tool.ty.src]
# The tests swap in fakes and wrong values on purpose, so ty checks the application code only.
include = ["src"]

[project.scripts]
iets-speed-control = "iets_speed_control.entrypoints.cli:cli"

[project.gui-scripts]
iets-speed-control-gui = "iets_speed_control.entrypoints.gui:gui"

[tool.pytest.ini_options]
minversion = "8.3.5"
addopts = "-ra -q -m 'not e2e'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
markers = [
    "e2e: marks tests as end-to-end tests that require real network access (deselect with '-m \"not e2e\"')",
    "gui: needs the shared Tk root; applied automatically, and kept out of parallel runs",
]
